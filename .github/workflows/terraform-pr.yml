name: Terraform PR

on:
  pull_request:
    paths: ["envs/**", "templates/**", "policies/**", ".github/workflows/**"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_owner: alp
  TF_VAR_aws_region: us-east-1

jobs:
  plan:
    name: Plan ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    concurrency:
      group: tfstate-${{ matrix.environment }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
        working-directory: envs/${{ matrix.environment }}
    env:
      TF_VAR_environment: ${{ matrix.environment }}
      TF_VAR_db_password: ${{ matrix.environment == 'prod' && secrets.DB_PASSWORD_PROD || secrets.DB_PASSWORD_DEV }}
    steps:
      - uses: actions/checkout@v4
      # Le role dev autorise les plans des deux environnements, sans approbation prod.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_DEV }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - run: terraform fmt -check -recursive
        working-directory: .
      - run: terraform init -input=false -lockfile=readonly
      - run: terraform validate
      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true
      - name: Commenter le plan
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          PLAN_ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.PLAN_ENVIRONMENT;
            const path = `envs/${env}/plan.txt`;
            if (!fs.existsSync(path)) return;
            const plan = fs.readFileSync(path, 'utf8').slice(0, 55000);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform plan (${env})\n\`\`\`text\n${plan}\n\`\`\``
            });
      - name: Statut du plan
        if: steps.plan.outcome == 'failure'
        run: exit 1
